name: Build OffTimer Fast

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install -r requirements.txt

      - name: Build fast-starting OffTimer
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name OffTimer offtimer.py

      - name: Upload OffTimer folder
        uses: actions/upload-artifact@v4
        with:
          name: OffTimer-Windows-x64-Fast
          path: dist/OffTimer/
          if-no-files-found: error
